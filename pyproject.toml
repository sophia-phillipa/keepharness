[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tail-harness"
version = "0.5.0"
description = "Local AI CLI control panel and private-network harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sophia Phillipa"}]
dependencies = ["starlette>=0.47,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "mcp>=1.12,<2", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
tail-harness = "control.cli:main"
tail-harness-install = "control.install:main"
tail-harness-mcp = "agent_service.mcp_bridge:main"
tail-harness-local = "control.start_local:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
adapters = ["README.md", "*/specs/*.md", "*/specs/**/*.md", "*/specs/*.json"]
tail_ui = ["assets/*"]
control = ["*.html", "*.css", "*.js"]
agent_service = ["*.html", "*.css", "*.js", "*.sh", "VERSION", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_media_sandbox: skip when ffmpeg/bwrap/prlimit or the bwrap user-namespace probe are unavailable",
    "slow: takes tens of seconds (packaging builds, venvs, the 0.5.0 upgrade path); skipped unless --run-slow",
    "live: spawns a real provider CLI and needs network/credentials; skipped unless TAIL_HARNESS_LIVE=1",
    "host_tools(*names): skip when one of the named host tools is missing from PATH",
]

[tool.setuptools.data-files]
"share/tail-harness/profiles" = ["profiles/qwen-vulkan-profile.json", "profiles/local-cpu-profile.json"]

[tool.setuptools.packages.find]
include = ["control", "agent_service", "agent_service.*", "tail_ui", "adapters", "adapters.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["agent_service/vendor", "tail_ui/assets", "graphify-out", "local-ai", "local_ai"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
